name: PicSecure Renew Native Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Increment every main-branch native release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: bump
        run: node scripts/bump-native-version.mjs
      - name: Commit the release version
        if: steps.bump.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android/app/build.gradle app/lib/app-version.ts src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore(release): bump PicSecure Renew to v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
      - name: Resolve exact release identity
        id: release
        shell: bash
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION_CODE=$(awk '$1 == "versionCode" { print $2; exit }' android/app/build.gradle)
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$RELEASE_VERSION_CODE" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run desktop:build
        env:
          VITE_PICSECURE_API_BASE: ${{ secrets.PICSECURE_API_BASE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_PICSECURE_BUILD_ID: ${{ github.sha }}
      - name: Prepare stable Windows download name
        shell: pwsh
        run: Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName "PicSecure-Renew-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: PicSecure-Renew-Windows
          path: PicSecure-Renew-Windows.exe

  android-apk:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
        env:
          VITE_PICSECURE_API_BASE: ${{ secrets.PICSECURE_API_BASE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_PICSECURE_BUILD_ID: ${{ github.sha }}
      - name: Configure private Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/picsecure-release.jks
          printf 'storeFile=../picsecure-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties
      - run: chmod +x gradlew && ./gradlew clean assembleRelease
        working-directory: android
      - name: Verify APK embeds the release version
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)
          test -n "$AAPT"
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          grep -F "versionName='${{ needs.prepare-release.outputs.version }}'" <<< "$BADGING"
          grep -F "versionCode='${{ needs.prepare-release.outputs.version_code }}'" <<< "$BADGING"
      - run: cp android/app/build/outputs/apk/release/app-release.apk PicSecure-Renew.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PicSecure-Renew-Android
          path: PicSecure-Renew.apk

  github-release:
    if: github.event_name == 'push'
    needs: [prepare-release, windows-installer, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create immutable update manifest
        run: node scripts/create-update-manifest.mjs
        env:
          PICSECURE_RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-native' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'PicSecure Renew — Latest Native Apps' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            artifacts/PicSecure-Renew-Windows/PicSecure-Renew-Windows.exe
            artifacts/PicSecure-Renew-Android/PicSecure-Renew.apk
            PicSecure-Renew-update.json
          generate_release_notes: true
